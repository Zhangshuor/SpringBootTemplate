version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_dev
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demo_db
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    container_name: redis_dev
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-net
  app:
    image: springboot-template:latest
    build: .
    container_name: springboot-template
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    ports:
      - "8080:8080"
    volumes:
      # 挂载宿主机构建好的 jar，版本迭代时只需 mvn package 后重启本服务
      - ./target/demo-1.0.0-SNAPSHOT.jar:/app/app.jar
    command: ["java", "-jar", "/app/app.jar"]
    networks:
      - app-net

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_frontend
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      # 前端构建后的静态资源，dist 目录替换即可更新
      - ./frontend/dist:/usr/share/nginx/html:ro
      # 自定义 nginx 配置
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-net

networks:
  app-net:
    driver: bridge


